[project]
name = "oriental-wisdom-agent"
version = "2.0.0"
description = "东方智慧智能体。对话内核是 core/agent.py，HTTP 入口是 integration/api_server_secure.py。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "flask",
    "flask-cors",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
